services:
  mediarr:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${PUID:?Set PUID}:${PGID:?Set PGID}"
    network_mode: host
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/config/mediarr.db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_PORT: ${MEDIARR_API_PORT:-5174}
      JELLYFIN_ENABLED: ${JELLYFIN_ENABLED:-false}
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      NODE_ENV: production
      CONFIG_DIR: /config
      MEDIA_DIR: /data
    volumes:
      - "${CONFIG_DIR:?Set CONFIG_DIR}:/config"
      - "${MEDIA_DIR:?Set MEDIA_DIR}:/data"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/health').then(async response => { const body = await response.json(); process.exit(response.ok && body.ok === true && typeof body.data?.status === 'string' ? 0 : 1); }).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
