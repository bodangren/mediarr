name: mediarr-connectivity-e2e

services:
  server:
    build:
      context: ../..
      dockerfile: tests/connectivity/Containerfile.server
    environment:
      DATABASE_URL: file:/tmp/connectivity.db
      NODE_ENV: test
      API_PORT: "8080"
      ENCRYPTION_KEY: connectivity-test-key
    # Use host networking so mDNS multicast works without avahi-reflector.
    # On rootless podman the bridge driver may not forward multicast; host
    # networking sidesteps this while keeping the test hermetic.
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/status"]
      interval: 3s
      timeout: 5s
      start_period: 40s
      retries: 15

  client-test:
    build:
      context: ../..
      dockerfile: tests/connectivity/Containerfile.client
    network_mode: host
    environment:
      # Override to skip mDNS and connect directly (useful in CI).
      # Leave unset to let the client discover via mDNS.
      MEDIARR_DIRECT_URL: "http://127.0.0.1:8080"
      MEDIARR_MDNS_TIMEOUT_SECS: "10"
    depends_on:
      server:
        condition: service_healthy
