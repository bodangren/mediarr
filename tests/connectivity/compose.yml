name: mediarr-connectivity-e2e

services:
  server:
    build:
      context: ../..
      dockerfile: tests/connectivity/Containerfile.server
    environment:
      DATABASE_URL: file:/tmp/connectivity.db
      NODE_ENV: test
      API_PORT: "8080"
      ENCRYPTION_KEY: connectivity-test-key
    networks:
      - e2e
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/system/status"]
      interval: 3s
      timeout: 5s
      start_period: 40s
      retries: 15

  client-test:
    build:
      context: ../..
      dockerfile: tests/connectivity/Containerfile.client
    networks:
      - e2e
    environment:
      # Connect directly to the server service via compose DNS (bypasses mDNS).
      # The Dart client skips mDNS discovery when this variable is set.
      MEDIARR_DIRECT_URL: "http://server:8080"
      MEDIARR_MDNS_TIMEOUT_SECS: "10"
    depends_on:
      server:
        condition: service_healthy

networks:
  e2e:
    driver: bridge
